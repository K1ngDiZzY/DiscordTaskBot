[project]
name = "discord-task-bot"
version = "1.0.0"
description = "A Discord task management bot with reminders, powered by SQLite"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3.2",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
